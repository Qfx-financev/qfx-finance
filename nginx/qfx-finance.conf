# ─── Rate limiting ────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;

# ─── Upstreams ────────────────────────────────────────────
upstream qfx_api    { server 127.0.0.1:3001; keepalive 32; }
upstream qfx_client { server 127.0.0.1:3000; keepalive 16; }
upstream qfx_admin  { server 127.0.0.1:3002; keepalive 8; }

# ─── Redirect HTTP → HTTPS ───────────────────────────────
server {
    listen 80;
    server_name qfx-finance.com www.qfx-finance.com api.qfx-finance.com admin.qfx-finance.com;
    return 301 https://$host$request_uri;
}

# ─── Main Client: qfx-finance.com ────────────────────────
server {
    listen 443 ssl http2;
    server_name qfx-finance.com www.qfx-finance.com;

    ssl_certificate     /etc/letsencrypt/live/qfx-finance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qfx-finance.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        proxy_pass http://qfx_client;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location /_next/static {
        proxy_pass http://qfx_client;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}

# ─── API: api.qfx-finance.com ────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.qfx-finance.com;

    ssl_certificate     /etc/letsencrypt/live/qfx-finance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qfx-finance.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 15M;

    location /api/auth {
        limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass http://qfx_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://qfx_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
    }
}

# ─── Admin: admin.qfx-finance.com ────────────────────────
server {
    listen 443 ssl http2;
    server_name admin.qfx-finance.com;

    ssl_certificate     /etc/letsencrypt/live/qfx-finance.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qfx-finance.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # IP whitelist — uncomment and update with your IP
    # allow YOUR.IP.ADDRESS.HERE;
    # deny all;

    location / {
        proxy_pass http://qfx_admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
